# Runs the API, Redis, the demo frontend, Prometheus and Grafana together.
#   API:        http://localhost:8000  (docs at /docs, metrics at /metrics)
#   Frontend:   http://localhost:8080
#   Prometheus: http://localhost:9090  (localhost only)
#   Grafana:    http://localhost:3000  (localhost only)
# The database is the hosted one in DATABASE_URI (.env), so no database service is needed here.

services:
  # Prediction cache only: no persistence, capped memory, evicts the least recently used keys.
  # No ports are published, so only other containers on the compose network can reach it.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    # Secrets (JWT_SECRET, DATABASE_URI, ...) come from .env, not from the image
    env_file: .env
    environment:
      # CORS: the browser sends requests from the frontend's origin, so the API must allow it
      ALLOWED_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      # Inside the container, localhost is the container itself, so use the service name
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Pulls /metrics from the API every 15s and keeps 15 days of history.
  # Published on localhost only. Use it to check Status > Targets and to try queries.
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  # Dashboards. The data source and dashboards are loaded from ./monitoring/grafana.
  # Published on localhost only: http://localhost:3000 (login: admin / GRAFANA_ADMIN_PASSWORD)
  grafana:
    image: grafana/grafana:13.3.1
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env. The fallback is for local use only.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

# Keep metric history and Grafana settings when containers are recreated
volumes:
  prometheus-data:
  grafana-data:
