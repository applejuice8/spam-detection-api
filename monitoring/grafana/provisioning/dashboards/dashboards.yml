# Loads every dashboard JSON in /var/lib/grafana/dashboards (mounted from monitoring/grafana/dashboards).
apiVersion: 1

providers:
  - name: spam-api
    type: file
    disableDeletion: true
    allowUiUpdates: true          # Edit in the UI, then export the JSON back into the repo
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
