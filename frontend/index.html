<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spam Detection API Demo</title>
<style>
  :root { --fg: #1c1c1e; --muted: #6b6b70; --line: #dcdce0; --bg: #f6f6f8; --accent: #2457d6; --spam: #c62828; --ham: #2e7d32; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 32px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  section.locked { opacity: .5; pointer-events: none; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 1.4em; }
  .msg.error { color: var(--spam); }
  .msg.ok { color: var(--ham); }
  code { font: 13px ui-monospace, monospace; background: var(--bg); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .result { margin-top: 12px; padding: 12px; border-radius: 6px; border: 1px solid var(--line); display: none; }
  .result .label { font-size: 18px; font-weight: 600; text-transform: uppercase; }
  .result.spam .label { color: var(--spam); }
  .result.ham .label { color: var(--ham); }
  .bar { height: 8px; background: var(--bg); border-radius: 4px; margin: 8px 0 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--spam); width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Spam Detection API</h1>
  <p class="sub">Sign in, create an API key, then classify some text.</p>

  <section>
    <h2>API URL</h2>
    <input id="base" value="http://127.0.0.1:8000" aria-label="API base URL">
    <div class="msg" id="health"></div>
  </section>

  <section id="auth">
    <h2>1. Account</h2>
    <label for="username">Username</label>
    <input id="username" autocomplete="username">
    <label for="password">Password (min 8 characters)</label>
    <input id="password" type="password" autocomplete="current-password">
    <label for="confirm">Confirm password (sign up only)</label>
    <input id="confirm" type="password" autocomplete="new-password">
    <div class="row">
      <button id="login">Log in</button>
      <button id="signup" class="secondary">Sign up</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </section>

  <section id="keySec" class="locked">
    <h2>2. API key</h2>
    <p class="muted" style="margin:0">Prediction requests are authenticated with an API key (<code>X-API-Key</code> header).</p>
    <div class="row"><button id="createKey">Create API key</button></div>
    <div class="msg" id="keyMsg"></div>
  </section>

  <section id="predictSec" class="locked">
    <h2>3. Predict</h2>
    <label for="text">Text to classify</label>
    <textarea id="text" maxlength="1000">Congratulations! You won a free prize. Click here to claim now.</textarea>
    <div class="row"><button id="predict">Classify</button></div>
    <div class="msg" id="predictMsg"></div>
    <div class="result" id="result">
      <div class="label" id="resLabel"></div>
      <div class="bar"><div id="resBar"></div></div>
      <div class="muted" id="resDetail"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const state = { accessToken: null, apiKey: null };

const base = () => $('base').value.replace(/\/+$/, '');

function say(id, text, kind = '') {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg ' + kind;
}

// FastAPI errors: {detail: "text"} or {detail: [{msg, loc}, ...]}
function errorText(data, res) {
  if (!data || !data.detail) return `Request failed (${res.status})`;
  if (typeof data.detail === 'string') return data.detail;
  return data.detail.map(d => `${(d.loc || []).slice(1).join('.')}: ${d.msg}`).join('; ');
}

async function api(path, { method = 'GET', headers = {}, body } = {}) {
  let res;
  try {
    res = await fetch(base() + path, { method, headers, body });
  } catch {
    throw new Error('Cannot reach the API. Check the URL, that the server is running, and that CORS allows this page.');
  }
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(errorText(data, res));
  return data;
}

async function withBusy(button, fn) {
  button.disabled = true;
  try { await fn(); } finally { button.disabled = false; }
}

async function checkHealth() {
  try {
    const data = await api('/health');
    say('health', `Connected (status: ${data.status})`, 'ok');
  } catch (e) {
    say('health', e.message, 'error');
  }
}

$('base').addEventListener('change', checkHealth);

$('signup').onclick = e => withBusy(e.target, async () => {
  try {
    const user = await api('/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: $('username').value,
        password: $('password').value,
        confirm_password: $('confirm').value,
      }),
    });
    say('authMsg', `Account "${user.username}" created. You can log in now.`, 'ok');
  } catch (err) {
    say('authMsg', err.message, 'error');
  }
});

$('login').onclick = e => withBusy(e.target, async () => {
  try {
    // /auth/login expects OAuth2 form data, not JSON
    const tokens = await api('/auth/login', {
      method: 'POST',
      body: new URLSearchParams({ username: $('username').value, password: $('password').value }),
    });
    state.accessToken = tokens.access_token;
    const me = await api('/auth/me', { headers: { Authorization: `Bearer ${state.accessToken}` } });
    say('authMsg', `Logged in as ${me.username}.`, 'ok');
    $('keySec').classList.remove('locked');
  } catch (err) {
    say('authMsg', err.message, 'error');
  }
});

$('createKey').onclick = e => withBusy(e.target, async () => {
  try {
    const created = await api('/auth/api-keys', {
      method: 'POST',
      headers: { Authorization: `Bearer ${state.accessToken}` },
    });
    state.apiKey = created.api_key || created.key;
    if (!state.apiKey) throw new Error('The response did not include an API key.');
    $('keyMsg').textContent = '';
    $('keyMsg').className = 'msg ok';
    $('keyMsg').append('Key created (shown once): ', Object.assign(document.createElement('code'), { textContent: state.apiKey }));
    $('predictSec').classList.remove('locked');
  } catch (err) {
    say('keyMsg', err.message, 'error');
  }
});

$('predict').onclick = e => withBusy(e.target, async () => {
  $('result').style.display = 'none';
  try {
    const r = await api('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': state.apiKey },
      body: JSON.stringify({ text: $('text').value }),
    });
    const pct = (r.spam_probability * 100).toFixed(1);
    const isSpam = r.label.toLowerCase() === 'spam';
    $('result').className = 'result ' + (isSpam ? 'spam' : 'ham');
    $('resLabel').textContent = r.label;
    $('resBar').style.width = pct + '%';
    $('resDetail').textContent = `Spam probability: ${pct}%  |  Model F1: ${r.model_f1.toFixed(3)}`;
    $('result').style.display = 'block';
    say('predictMsg', '');
  } catch (err) {
    say('predictMsg', err.message, 'error');
  }
});

checkHealth();
</script>
</body>
</html>
