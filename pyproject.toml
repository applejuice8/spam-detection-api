[project]
name = "spam-detection-api"
version = "0.1.0"
description = "Spam detection REST API: FastAPI, scikit-learn, Redis cache, Prometheus metrics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "joblib>=1.6.0",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.15.0",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",      # Starlette's TestClient uses it (httpx support is deprecated)
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]
train = [
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "kagglehub[pandas-datasets]>=1.0.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[tool.ruff]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, bugbear. Line length is left to the author.
select = ["E4", "E7", "E9", "F", "B"]
# B008: FastAPI's Depends() in argument defaults is the framework's idiom
ignore = ["B008"]
